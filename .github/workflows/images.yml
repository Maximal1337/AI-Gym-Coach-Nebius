# Images and deploys (NH-37, D-32). Runs only after CI has passed on a push to
# main: builds the relay image — and the Hermes sandbox image once NH-21 adds
# its Dockerfile — for linux/amd64, pushes them to GHCR, then commits the new
# tags to deploy/. Argo CD on the VPS pulls that commit. A red CI run never
# gets here, so the cluster stays on the previous version.
#
# GitHub-hosted runners only; a self-hosted runner on a public repository
# would run strangers' pull-request code on our machine.
name: Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: images-main
  cancel-in-progress: false

jobs:
  build:
    # A push to this repository's main only: a pull request from a fork's own
    # `main` also completes CI with head_branch "main", and must never deploy.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      hermes: ${{ steps.meta.outputs.hermes }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "tag=sha-${SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"
          if [ -f deploy/images/hermes-sandbox/Dockerfile ]; then echo "hermes=true"; else echo "hermes=false"; fi >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Relay
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/relay/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.registry }}/notch-relay:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,scope=relay,mode=max

      # The sandbox image comes with the spike (NH-21), built from NemoClaw's
      # Hermes blueprint. Until its Dockerfile exists this step is skipped.
      - name: Hermes sandbox
        if: steps.meta.outputs.hermes == 'true'
        uses: docker/build-push-action@v7
        with:
          context: deploy/images/hermes-sandbox
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.registry }}/notch-hermes-sandbox:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=hermes
          cache-to: type=gha,scope=hermes,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # main as it is now, with full history: the bump checks that the tested
      # commit isn't older than what's already deployed.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: bump
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ needs.build.outputs.tag }}
          HERMES: ${{ needs.build.outputs.hermes }}
        run: |
          node scripts/bump-image-tag.mjs notch-relay "$TAG" --commit "${SHA:0:12}"
          if [ "$HERMES" = true ]; then
            node scripts/bump-image-tag.mjs notch-hermes-sandbox "$TAG" --commit "${SHA:0:12}"
          fi
          if git diff --quiet; then echo "changed=false"; else echo "changed=true"; fi >> "$GITHUB_OUTPUT"

      # [skip ci]: the commit only moves tags; its code is the commit CI just
      # tested, so it must not start another CI → Images round.
      - if: steps.bump.outputs.changed == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${SHA:0:12} to the cluster [skip ci]"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          exit 1
