name: Secret scan

# Scans the full git history for leaked credentials (NH-05). Run it manually
# (workflow_dispatch) as the last step before making the repository public.
# GITLEAKS_LICENSE is only required if the repository moves to an
# organization account (free key from gitleaks.io); personal accounts need none.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
