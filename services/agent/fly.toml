# This repository is the hackathon copy of AI-Gym-Coach. The live app's agent
# service, gymcoach-agent, is deployed only from the original repository; the
# hackathon app runs this code inside its own Edge Functions instead (DOR-135).
# The app named here doesn't exist, on purpose: a `fly deploy` from this
# repository fails rather than replacing the live service. Don't put
# gymcoach-agent back.
app = "notch-nebius-no-fly-deploy"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
