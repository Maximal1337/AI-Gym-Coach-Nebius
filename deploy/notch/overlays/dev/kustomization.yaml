# notch-dev: team accounts only, until 2026-11-14 (D-31). Its Supabase side
# is the same project; assistant_agents.environment = 'dev' routes a team
# account's jobs here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notch-dev
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: notch-relay-config
    literals:
      - RELAY_ENV=dev
      # The sandbox manager (NH-55), on since the spike's NH-29. Prod stays
      # static until a go in NH-27.
      - RELAY_SANDBOXES=manager
      # How long an empty claim waits before the next one: every claim is an
      # Edge Function call, and at the 2 s default two relays make about 86,000
      # a day. Until assistant-outbox's claim waits for a job itself (long
      # polling), then back to the default.
      - RELAY_IDLE_POLL_MS=10000
      # The environment's shared OpenShell providers every sandbox gets (NH-33).
      - SANDBOX_SHARED_PROVIDERS=token-factory,tavily
      # The environment's OpenShell gateway, in this namespace (NH-29).
      - OPENSHELL_GATEWAY_ENDPOINT=https://openshell.notch-dev.svc:8080
      # The per-sandbox memory limit, the NH-35 watchdog: OpenShell sets it as
      # the pod's memory request and limit. Unset until NH-25 measures Hermes;
      # then e.g. SANDBOX_MEMORY=900Mi (the cap times this must fit the RAM left
      # for sandboxes). It applies to sandboxes created after the change.
