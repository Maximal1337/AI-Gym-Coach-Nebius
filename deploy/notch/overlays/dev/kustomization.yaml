# notch-dev: team accounts only, until 2026-11-14 (D-31). Its Supabase side
# is the same project; assistant_agents.environment = 'dev' routes a team
# account's jobs here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notch-dev
resources:
  - namespace.yaml
  - ../../base
# The relay's image. Only CI changes the tag, after green tests (NH-37):
# scripts/bump-image-tag.mjs rewrites the line marked `# image-tag: notch-relay`.
images:
  - name: notch-relay
    newName: ghcr.io/maximal1337/notch-relay
    newTag: sha-84c1a596a43e # image-tag: notch-relay
configMapGenerator:
  - name: notch-relay-config
    literals:
      - RELAY_ENV=dev
      # The sandbox manager (NH-55), on since the spike's NH-29; prod since
      # NH-27's go (D-36).
      - RELAY_SANDBOXES=manager
      # The environment's shared OpenShell providers every sandbox gets (NH-33).
      - SANDBOX_SHARED_PROVIDERS=token-factory,tavily
      # The environment's OpenShell gateway, in this namespace (NH-29).
      - OPENSHELL_GATEWAY_ENDPOINT=https://openshell.notch-dev.svc:8080
      # The per-sandbox memory limit, the NH-35 watchdog: OpenShell sets it as
      # the pod's memory request and limit. NH-25's soak: Hermes levels off at
      # 300-304 MiB and a turn adds about 35, so 640Mi is twice the plateau
      # and a turn (D-36). It applies to sandboxes created after the change,
      # so test accounts A's and B's keep none until they are created again.
      - SANDBOX_MEMORY=640Mi
