# What every environment namespace runs besides its OpenShell gateway: the
# relay and the NetworkPolicies. Overlays (dev, prod) set the namespace,
# RELAY_ENV and the relay's image tag: CI moves dev's (NH-37), and prod's
# moves only by a commit of its own (D-37).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: notch
resources:
  - relay.yaml
  - network-policies.yaml
