# Wave 0: prod — its Namespace, NetworkPolicies and the relay
# (deploy/notch/overlays/prod). Tracks main like every app here (D-32); the
# relay's image tag is changed only by CI after green tests (NH-37).
# Frozen 2026-12-01 → 12-15 by the sync window in deploy/argocd/projects.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notch-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: notch
  source:
    repoURL: https://github.com/Maximal1337/AI-Gym-Coach-Nebius.git
    targetRevision: main
    path: deploy/notch/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: notch-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
