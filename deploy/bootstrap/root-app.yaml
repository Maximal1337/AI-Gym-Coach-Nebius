# The root Application (app of apps), applied once by bootstrap.sh. It syncs
# deploy/argocd from main: the AppProjects, the OCI Helm repository and one
# child Application per component (deploy/argocd/apps). Every other change to
# the cluster goes through Git (D-32); secrets are the one exception
# (secrets.sh).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Maximal1337/AI-Gym-Coach-Nebius.git
    targetRevision: main
    path: deploy/argocd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
