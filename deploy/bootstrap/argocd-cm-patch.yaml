# Merged into argocd-cm by bootstrap.sh. The root Application orders its child
# Applications with sync waves (deploy/argocd/apps); a wave only waits for the
# previous one when Argo CD can tell whether an Application is healthy. This
# is the health check from the Argo CD docs ("App of Apps" / 1.7 → 1.8 notes).
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
